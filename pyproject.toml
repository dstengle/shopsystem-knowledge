[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-knowledge"
version = "0.1.0"
description = "The shop's interface to its knowledge base: types, seed content, renderers, and the shop-knol command line"
requires-python = ">=3.11"
dependencies = [
  "shopsystem-kb @ git+https://github.com/dstengle/shopsystem-kb.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-bdd>=8",
]

[project.scripts]
shop-knol = "shop_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shop_knowledge.types" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features"
