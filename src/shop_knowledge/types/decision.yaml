title: Decision
version: 1
schema:
  allOf:
    - $ref: kb:schema/shop-artifact
  type: object
  properties:
    title:
      type: string
    statement:
      type: string
      maxLength: 200
      pattern: '^[^\n]*(?!\n)$'
    date:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    number:
      type: integer
      minimum: 1
    supersedes:
      type: string
      ref:
        targets: [decision]
        cardinality: one
        parts: false
        on_delete: refuse
    shop:
      type: string
      ref:
        targets: [shop]
        cardinality: one
        parts: false
        on_delete: refuse
    revisit_when:
      type: string
    extends:
      type: array
      items:
        type: string
      ref:
        targets: [decision]
        cardinality: many
        parts: false
        on_delete: refuse
  required: [title, statement, date, number, shop]
  sections:
    - title: Purpose
    - title: Rationale
  summary: [statement, date, supersedes, shop]
