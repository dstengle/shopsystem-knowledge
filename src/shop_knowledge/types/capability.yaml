title: Capability
version: 1
schema:
  allOf:
    - $ref: kb:schema/shop-artifact
  type: object
  properties:
    title:
      type: string
    shop:
      type: string
      ref:
        targets: [shop]
        cardinality: one
        parts: false
        on_delete: refuse
    gist:
      type: string
      maxLength: 200
      pattern: '^[^\n]*(?!\n)$'
    narrator:
      type: string
    rests_on:
      type: array
      items:
        type: string
      ref:
        targets: [decision]
        cardinality: many
        parts: false
        on_delete: refuse
  required: [title, shop, gist, narrator]
  sections:
    - title: Purpose
  summary: [shop, gist]
  parts:
    behaviour:
      items:
        type: object
        properties:
          title:
            type: string
            maxLength: 80
            pattern: '^[^\n]*(?!\n)$'
          says:
            type: string
        required: [title, says]
    not_yet:
      items:
        type: object
        properties:
          title:
            type: string
            maxLength: 80
            pattern: '^[^\n]*(?!\n)$'
          defers:
            type: string
          trigger:
            type: string
        required: [title, defers, trigger]
