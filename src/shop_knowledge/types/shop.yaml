title: Shop
version: 1
schema:
  allOf:
    - $ref: kb:https://missingmass.io/shopsystem/shop-artifact@1
  type: object
  properties:
    title:
      type: string
    product:
      type: string
      ref:
        targets: [https://missingmass.io/shopsystem/product]
        cardinality: one
        parts: false
        on_delete: refuse
    gist:
      type: string
      maxLength: 200
      pattern: '^[^\n]*(?!\n)$'
    narrator:
      type: string
  required: [title, product, gist]
  sections:
    - title: Purpose
    - title: Order of building
    - title: Testing
  summary: [product, gist]
  parts:
    constraints:
      items:
        type: object
        properties:
          title:
            type: string
            maxLength: 80
            pattern: '^[^\n]*(?!\n)$'
          says:
            type: string
          tested_in:
            type: array
            items:
              type: string
            ref:
              targets: [https://missingmass.io/shopsystem/capability]
              cardinality: many
              parts: false
              on_delete: refuse
        required: [title, says]
